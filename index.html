<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WiFiCash</title>
    <meta name="description" content="Monétisez la connexion Wi-Fi de vos établissements grâce à WiFiCash, la plateforme SaaS ultime pour cafés, hôtels et restaurants." />
    <meta property="og:title" content="WiFiCash" />
    <meta property="og:description" content="Monétisez la connexion Wi-Fi de vos établissements grâce à WiFiCash, la plateforme SaaS ultime pour cafés, hôtels et restaurants." />
    <script>
      (function() {
        // 1. Silent stub for Vite dev WebSocket connections when HMR is disabled in cloud runner
        if (typeof window !== 'undefined' && 'WebSocket' in window) {
          var RealWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            if (urlStr.includes('vite') || urlStr.includes('token') || urlStr.startsWith('ws://') || urlStr.startsWith('wss://')) {
              var stub = {
                url: urlStr,
                readyState: 3, // CLOSED
                bufferedAmount: 0,
                extensions: '',
                protocol: '',
                binaryType: 'blob',
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                onopen: null,
                onerror: null,
                onclose: null,
                onmessage: null,
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() { return false; },
                send: function() {},
                close: function() {}
              };
              return stub;
            }
            return new RealWebSocket(url, protocols);
          };
          window.WebSocket.prototype = RealWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // 2. Comprehensive console and unhandled rejection filters
        var isWsError = function(obj) {
          if (!obj) return false;
          var s = '';
          try {
            if (typeof obj === 'string') s = obj;
            else if (obj.message) s = String(obj.message);
            else if (obj.reason) s = String(obj.reason);
            else if (obj.stack) s = String(obj.stack);
            else s = String(obj);
          } catch(e) {
            s = '';
          }
          var lower = s.toLowerCase();
          return lower.includes('websocket') || 
                 lower.includes('failed to connect to websocket') ||
                 lower.includes('websocket closed without opened') ||
                 lower.includes('@vite/client') || 
                 lower.includes('createwebsocketmodulerunnertransport') ||
                 s.includes('[vite]');
        };

        var origWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          for (var i = 0; i < args.length; i++) {
            if (isWsError(args[i])) return;
          }
          origWarn.apply(console, args);
        };

        var origError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          for (var i = 0; i < args.length; i++) {
            if (isWsError(args[i])) return;
          }
          origError.apply(console, args);
        };

        var origLog = console.log;
        console.log = function() {
          var args = Array.prototype.slice.call(arguments);
          for (var i = 0; i < args.length; i++) {
            if (isWsError(args[i])) return;
          }
          origLog.apply(console, args);
        };

        window.addEventListener('error', function(e) {
          if (isWsError(e.message) || isWsError(e.error) || (e.target && e.target.nodeName === 'SCRIPT' && isWsError(e.target.src))) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isWsError(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
